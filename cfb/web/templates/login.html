{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<section class="panel auth-panel" aria-labelledby="login-title">
  <h1 id="login-title">Log in</h1>
  {%- if error %}
  <p class="form-message error" role="alert">{{ error }}</p>
  {%- endif %}
  <form method="post" action="/login" class="auth-form">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" value="{{ username }}" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p class="muted small">Accounts are created by the site owner. Ask them if you need one.</p>
</section>
{% endblock %}
